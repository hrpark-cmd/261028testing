<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>연구 | OO 연구실</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">OO 연구실</a>
      <nav class="nav">
        <a href="index.html">홈</a>
        <a href="research.html">연구</a>
        <a href="courses.html">수업</a>
        <a href="discussion.html">토론</a>
      </nav>
      <div id="auth-box" class="auth-box"></div>
    </div>
  </header>

  <main class="wrap" data-collection="research">
    <h1>연구</h1>
    <p class="muted">연구 결과, 논문, 발표 자료를 모아둔 곳입니다.</p>
    <form id="item-form" class="card form" hidden>
      <h3>자료 추가 (관리자)</h3>
      <input name="title" placeholder="제목" required maxlength="200" />
      <input name="meta" placeholder="연도 (예: 2026)" />
      <textarea name="summary" rows="3" placeholder="요약"></textarea>
      <input name="link" type="url" placeholder="자료 링크 (Google Drive, DOI 등)" />
      <button class="btn" type="submit">등록</button>
    </form>
    <div id="item-list" class="stack"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap small muted">© 2026 OO 연구실 · 기계공학과</div>
  </footer>
  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/content.js"></script>
</body>
</html>
