# Netlify 배포 설정
# - GitHub에 push 하면 Netlify가 아래 명령으로 빌드하고 dist 폴더를 배포합니다.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA 라우팅: 어떤 주소로 새로고침해도 index.html 을 보여줍니다 (public/_redirects 와 같은 역할)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
