<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>토론 | OO 연구실</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">OO 연구실</a>
      <nav class="nav">
        <a href="index.html">홈</a>
        <a href="research.html">연구</a>
        <a href="courses.html">수업</a>
        <a href="discussion.html">토론</a>
      </nav>
      <div id="auth-box" class="auth-box"></div>
    </div>
  </header>

  <main class="wrap">
    <h1>토론 게시판</h1>
    <p id="login-notice" class="notice">로그인한 사용자만 글을 읽고 쓸 수 있습니다.</p>
    <form id="post-form" class="card form" hidden>
      <input name="title" placeholder="제목" required maxlength="200" />
      <textarea name="body" rows="5" placeholder="내용" maxlength="20000"></textarea>
      <button class="btn" type="submit">글 올리기</button>
    </form>
    <div id="post-list" class="stack"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap small muted">© 2026 OO 연구실 · 기계공학과</div>
  </footer>
  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/discussion.js"></script>
</body>
</html>
